<script>
// Auto-redirect to user's browser language (if supported), otherwise to English.
(function () {
  try {
    var supported = ["en","fr","de","es","pt"];
    var stored = localStorage.getItem("infovisa_lang");
    var browser = (navigator.language || "en").slice(0,2).toLowerCase();
    var pick = stored && supported.indexOf(stored) !== -1 ? stored
             : (supported.indexOf(browser) !== -1 ? browser : "en");
    if (window.location.pathname === "/" || window.location.pathname === "/index.html") {
      window.location.replace("/" + pick + "/");
    }
  } catch (e) {}
})();
</script>

    </div>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
